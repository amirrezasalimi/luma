<button id="gear" title="Settings" aria-label="Settings">⚙</button>

<div id="m"><div id="card">

<h3>LLM · OPENAI-COMPATIBLE</h3>

<label>API key</label><input id="key" type="password" placeholder="sk-...">
<label>Model</label><input id="model" placeholder="gpt-4o-mini">

</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
<script>
// NOTE: model downloads + LLM calls need network access; a claude.ai-hosted page blocks them, so run this file from your own host/localhost.
// STT worker files go in ./whistle/  (hf download hf://spaces/mrfakename/whistle-webgpu --local-dir whistle)

// ============================================================================
// 1. CONFIG & SETTINGS DIALOG
// ============================================================================
const DEF={endpoint:'https://api.openai.com/v1',key:'',model:'gpt-4o-mini',reasoningEffort:'',sys:'You are JARVIS, a concise, witty AI assistant.',tts:'phonon-tts',voice:'',stt:'whistle-webgpu',sttMode:'browser',dev:'webgpu'};
let cfg={...DEF};try{cfg={...DEF,...JSON.parse(localStorage.getItem('jarvis-cfg')||'{}')}}catch(e){}
const $=id=>document.getElementById(id),F=['endpoint','key','model','reasoningEffort','sys','tts','voice','stt','sttMode','dev'];
const openM=()=>{F.forEach(k=>{if(k==='voice')setVoiceOptions(cfg.voice);else $(k).value=cfg[k]});$('m').classList.add('on');refreshVoices()};
$('gear').onclick=openM;$('x').onclick=()=>{stopVoiceDemo();$('m').classList.remove('on')};
$('m').onclick=e=>{if(e.target.id==='m'){stopVoiceDemo();$('m').classList.remove('on')}};
$('sv').onclick=()=>{stopVoiceDemo();F.forEach(k=>cfg[k]=$(k).value);try{localStorage.setItem('jarvis-cfg',JSON.stringify(cfg))}catch(e){}$('m').classList.remove('on')};

// ============================================================================
// 2. PALETTES (hue-shifted: shadows violet, lights warm yellow)
// ============================================================================
const hx=h=>{const n=parseInt(h.slice(1),16);return 0xff000000|((n&255)<<16)|(n&0xff00)|((n>>16)&255)};
const P=['#140e30','#241e5c','#4a5a9e','#d8b86a', '#5a1f8a','#e8541c','#ffb400','#fff1a0', '#1a3d9a','#1fa3d6','#44e0d8','#e4fff4'].map(hx),BG=hx('#0a0720'),HZ=['#1a0e3c','#3a1450','#6a2a50'].map(hx);
const Bay=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);

// ============================================================================
// 3. HOLOGRAM GEOMETRY
// ============================================================================
const NR=64,NP=44,rA=[];
for(let i=0;i<NR;i++){const a=[Math.random()-.5,Math.random()-.5,Math.random()-.5],l=Math.hypot(...a);a.forEach((_,k)=>a[k]/=l);
 let u=[-a[1],a[0],0];const ul=Math.hypot(...u)||1;u=u.map(x=>x/ul);const v=[a[1]*u[2]-a[2]*u[1],a[2]*u[0]-a[0]*u[2],a[0]*u[1]-a[1]*u[0]];
 rA.push({u,v,R:2.1+Math.random()*.7,sp:(Math.random()-.5)*1.2,ph:Math.random()*6.28,span:1.4+Math.random()*4.8,mat:i%9==0?2:1})}
const NT=NR*NP+160,pos=new Float32Array(NT*3),pm=new Uint8Array(NT);
// live hologram / floor settings (changed through the scene API, eased toward HT each frame)
let HX=0,HY=3.7,HQ=0,HR=2.8,SR=6.4,FG=1.2,HSC=1,TC0=0xffb400,TCs=0x44e0e8,HC='#ffb400',HCs='#44e0e8',RC='#ffb400',FC='#4a5a9e';
const HT={x:0,y:3.7,z:0,r:2.8,sr:6.4},HLB=new Map(),HLH=new Set(),HLT=new Map(),sp_=Math.sin(Math.PI/6),cp_=Math.cos(Math.PI/6);
const rampN=h=>{const c=parseInt(h.slice(1),16),m=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),A=[c>>16&255,c>>8&255,c&255],n=a=>(a[0]|0)<<16|(a[1]|0)<<8|(a[2]|0);return[n(m(A,[20,8,40],.75)),n(m(A,[20,8,40],.35)),n(A),n(m(A,[255,246,200],.6))]};
function holoSet(p){p=p||{};const o=p.pos||p,cl=(v,a,b)=>Math.min(b,Math.max(a,+v)),hex=v=>{if(!/^#[0-9a-f]{6}$/i.test(v))throw new Error('color must be #rrggbb, got '+v);return v};
 if(o.x!=null)HT.x=cl(o.x,-12,12);if(o.y!=null)HT.y=cl(o.y,.5,12);if(o.z!=null)HT.z=cl(o.z,-12,12);
 if(p.radius!=null)HT.r=cl(p.radius,.5,6);if(p.floorRadius!=null)HT.sr=cl(p.floorRadius,1.5,16);if(p.floorGrid!=null)FG=cl(p.floorGrid,.3,6);
 if(p.color!=null){HC=hex(p.color);GR.splice(0,4,...rampN(HC))}
 if(p.speakingColor!=null){HCs=hex(p.speakingColor);CYr.splice(0,4,...rampN(HCs))}
 if(p.ringColor!=null){RC=hex(p.ringColor);TC0=parseInt(RC.slice(1),16)}
 if(p.ringSpeakingColor!=null)TCs=parseInt(hex(p.ringSpeakingColor).slice(1),16);
 if(p.floorColor!=null){FC=hex(p.floorColor);const f=rampN(FC);for(let i=0;i<4;i++)P[i]=abgr([f[i]>>16&255,f[i]>>8&255,f[i]&255])}}
const holoGet=()=>({x:+HX.toFixed(2),y:+HY.toFixed(2),z:+HQ.toFixed(2),radius:+HR.toFixed(2),floorRadius:+SR.toFixed(2),floorGrid:FG,target:{...HT},color:HC,speakingColor:HCs,ringColor:RC,floorColor:FC});

// ============================================================================
// 4. STATE & PIXI STAGE
// ============================================================================
let W,H,S,C=document.createElement('canvas'),g2=C.getContext('2d'),img,u32,px,dep,sh,tex,spr;
const stageBackground={config:{},image:null,colors:[],epoch:0,sprite:null};
function fitStageBackground(){const b=stageBackground;if(!b.sprite||!b.image)return;const width=app.screen.width,height=app.screen.height,scale=Math.max(width/b.image.naturalWidth,height/b.image.naturalHeight);b.sprite.scale.set(scale);b.sprite.position.set(width/2,height/2);b.sprite.alpha=b.config.opacity}
function clearStageBackgroundSprite(){const sprite=stageBackground.sprite;if(sprite){sprite.destroy({texture:true,baseTexture:true});stageBackground.sprite=null}}
const cam={yaw:.6,zoom:1,px:0,py:0};let mode='idle',E=0,tE=0,micE=0,tm=0,spkT=0,bars=new Float32Array(96),pulses=[],dragLock=false,talkTo=null,talkName='';
let actx,an,fd,stream;
const app=new PIXI.Application({background:0x0a0720,antialias:false,resolution:1,autoDensity:false});
app.view.id='v';document.body.prepend(app.view);
const lab=new PIXI.Text('TAP THE CORE TO SPEAK',{fontFamily:'ui-monospace,Menlo,Consolas,monospace',fontSize:15,fill:0xffffff,letterSpacing:4,fontWeight:'bold'});lab.anchor.set(.5);
const ring=new PIXI.Graphics();app.stage.addChild(ring,lab);
function resize(){const d=devicePixelRatio||1,DW=Math.round(innerWidth*d),DH=Math.round(innerHeight*d);
 S=Math.max(2,Math.round(DW/(+new URLSearchParams(location.search).get('px')||600)));W=Math.floor(DW/S);H=Math.floor(DH/S);app.renderer.resize(DW,DH);
 C.width=W;C.height=H;img=g2.createImageData(W,H);u32=new Uint32Array(img.data.buffer);px=new Uint8Array(W*H);dep=new Float32Array(W*H);sh=new Uint8Array(W*H);
 if(spr){spr.destroy();tex.destroy(true)}
 tex=new PIXI.Texture(new PIXI.BaseTexture(C,{scaleMode:PIXI.SCALE_MODES.NEAREST}));spr=new PIXI.Sprite(tex);spr.scale.set(S);app.stage.addChildAt(spr,stageBackground.sprite?1:0);fitStageBackground();
 lab.style.fontSize=Math.max(12,Math.round(13*d));lab.x=DW/2;lab.y=DH-40*d}
addEventListener('resize',resize);resize();

// ============================================================================
// 5. AUDIO / MIC / TAP
// ============================================================================
async function mic(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});actx=actx||new AudioContext({sampleRate:16000});
 an=actx.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.7;const src=actx.createMediaStreamSource(stream);src.connect(an);startVAD(src);fd=new Uint8Array(an.frequencyBinCount);return true}catch(e){lab.text='MIC UNAVAILABLE';return false}}
function stopMic(){proc&&proc.disconnect();stream&&stream.getTracks().forEach(t=>t.stop());stream=an=null}
function tapCore(){if(talkTo)window.setTalk(null);else tap()}
async function tap(){
 if(mode==='idle'){if(await mic()){mode='listening';vadOn=true;muted=false;lab.text='LISTENING...';if(cfg.sttMode==='browser')startRec();else loadW().then(()=>{if(mode==='listening'&&!muted)lab.text='LISTENING...'}).catch(e=>{console.error(e);lab.text='STT FAILED: '+String(e.message).slice(0,40)})}}
 else{mode='idle';cancelTurn();vadOn=false;stopMic();lab.text='TAP THE CORE TO SPEAK'}}

// ============================================================================
// 6. POINTER INPUT (orbit / pan / zoom / core tap / HUD buttons)
// ============================================================================
const ptr=new Map();let moved=0,pd=0;
const V=app.view;V.addEventListener('contextmenu',e=>e.preventDefault());
V.addEventListener('pointerdown',e=>{V.setPointerCapture(e.pointerId);ptr.set(e.pointerId,e);moved=0;V.style.cursor='grabbing';if(ptr.size==2){const[a,b]=[...ptr.values()];pd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}});
V.addEventListener('pointermove',e=>{const o=ptr.get(e.pointerId);if(!o)return;
 if(ptr.size==2){ptr.set(e.pointerId,e);const[a,b]=[...ptr.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);cam.zoom=Math.min(3,Math.max(.4,cam.zoom*d/pd));pd=d;return}
 const dx=e.clientX-o.clientX,dy=e.clientY-o.clientY;moved+=Math.abs(dx)+Math.abs(dy);ptr.set(e.pointerId,e);
 if(e.buttons&2||e.shiftKey){cam.px+=dx;cam.py+=dy}else if(!dragLock)cam.yaw-=dx*.008});
const up=e=>{if(e.type==='pointerup'&&ptr.has(e.pointerId)&&ptr.size===1&&moved<6&&window.selectAgentAtPointer?.(e)){ptr.delete(e.pointerId);V.style.cursor='grab';return}if(ptr.has(e.pointerId)&&ptr.size==1&&moved<6){const r=V.getBoundingClientRect(),k=V.width/r.width,mx=(e.clientX-r.left)*k/S,my=(e.clientY-r.top)*k/S;
  const c=proj(HX,HY,HQ);{const px_=(e.clientX-r.left)*k,py_=(e.clientY-r.top)*k,b=btns.find(b=>px_>=b.x0&&px_<=b.x1&&py_>=b.y0&&py_<=b.y1);if(b)b.fn();else if(Math.hypot(mx-c[0],my-c[1])<scl()*1.6*HSC)tapCore()}
 }

const JDOC=`WORKSPACE & SUB-AGENT ORCHESTRATOR:
You control sub-agents that appear as colored mini-holograms beside you and build 3D shapes, arrows, links, nodes, scripts and panels on the stage.
Put directives inside double square brackets in your reply (never spoken aloud):
- [[agent Name | optional task text | optional exact model ID | optional peers]] spawns an agent; blank task starts idle with no LLM call, even without a soul. An explicit model ID overrides the sub-agent default; omit it to use that default (or main model if no sub-agent default is set). Examples (e.g. [[agent Arch | draw 3-tier system | | Net,DB]] or [[agent Builder | build cubes | | all]]).
- [[share Name1 | Name2]] or [[share all]] grants sub-agents permission to see each other's state and message each other directly. Sub-agents are isolated unless you grant peer access!
- [[unshare Name]] revokes peer visibility for an agent.
- [[tell Name | instructions]] sends new instructions or fixes to an existing agent (restarts it if finished or failed).
- [[stop Name]] (or [[stop all]]), [[resume Name]], [[kill Name]] (removes its mini-hologram from the scene).
- [[clear]], [[add cube | label | #hex]] (kinds: cube pyramid poly sphere text arrow node), [[del id]].
Never put periods, question marks or brackets inside a directive.
You can also run JavaScript yourself: put a fenced js block in your reply (executed instantly, never spoken) using the scene API below; anything you create is owned by "jarvis". Your js can control your own hologram and the sub-agent holograms too, for example hologram("Arch").color("#ff3ea5").
`+API_DOC+`
ORCHESTRATION RULES:
1. Always read LIVE STATE first (agents, scene, world). If an existing agent's name or task relates to the order (same subsystem, topic or node group, or it is idle or done), reuse it with [[tell Name | new instructions]]; never spawn a duplicate. Fix failures the same way, or [[kill Name]] and respawn.
2. BIG orders (a system, a full scene, a many-part diagram, a game, an interactive demo): decompose into 2 to 5 parts and spawn one agent per part with a role name (for example Arch, Data, UI, Anim). Give each a self-contained task: its deliverable, its stage region (x range), an id prefix, the node hierarchy to use, which scripts and exported variables to create, and any hand-off to a peer. Grant peers with the fourth field, for example [[agent UI | build the dashboard panel with nodes and scripts, ids start ui_, region x 0 to 5 | | all]]. Spawn them in the same reply so they run in parallel.
2b. NEVER build a complex or multi-part order yourself with your own js block, and do not cram it into one agent: always delegate it to sub-agents as in rule 2. Your own js is only for trivial one-step changes or quick edits to what the agents built.
3. SMALL orders (one shape, a tweak, one animation): do it yourself with a js block, no agent.
4. After spawning say one short sentence about the plan and do not wait. Completion and error reports arrive as events; then verify against LIVE STATE, send fix-ups with [[tell]], and summarize the result to the user. When the user is talking to a sub-agent directly, you are not addressed.
5. Use the WORLD values to keep creations clear of the main hologram, the sub-agent holograms and the floor edge.
Node scripts with ERR in LIVE STATE show the exact failure and line; route it to the agent that owns the script (the by field).
`;
