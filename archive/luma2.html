<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S. Hologram</title>
<style>
:root{--bg:#0a0720;--fg:#f3ecff;--card:#1d1740;--line:#4a4590;--acc:#e8541c;--acc2:#1fa3d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1d1740;--fg:#f3ecff;--line:#4a4590}}
:root[data-theme="dark"]{--card:#1d1740;--fg:#f3ecff;--line:#4a4590}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace}
canvas#h{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;image-rendering:pixelated}
canvas#v{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gear{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;border:2px solid var(--fg);background:var(--card);color:var(--fg);font-size:22px;cursor:pointer;transition:transform .5s cubic-bezier(.2,.9,.3,1.4),background .2s,box-shadow .2s;z-index:5}
#gear:hover{transform:rotate(120deg) scale(1.12);background:var(--acc);color:#fff;box-shadow:4px 4px 0 var(--fg)}
#m{position:fixed;inset:0;display:grid;place-items:center;background:rgba(42,31,85,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#m.on{opacity:1;pointer-events:auto}
#card{width:min(440px,92vw);max-height:90vh;overflow:auto;background:var(--card);color:var(--fg);border:2px solid var(--fg);box-shadow:8px 8px 0 var(--acc);padding:18px;transform:translateY(18px) scale(.96);transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}
#m.on #card{transform:none}
#card h2{margin:0 0 10px;font-size:15px;letter-spacing:.2em}
#card h3{margin:14px 0 6px;font-size:11px;letter-spacing:.2em;color:var(--acc)}
label{display:block;font-size:11px;margin:8px 0 3px;opacity:.8}
input,select,textarea{width:100%;padding:8px;font:inherit;font-size:13px;background:transparent;color:var(--fg);border:2px solid var(--line);transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--acc2)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:3px 3px 0 var(--acc)}
.r{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
button.b{padding:8px 16px;font:inherit;font-size:12px;letter-spacing:.1em;border:2px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;transition:transform .12s,background .15s,color .15s}
button.b:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--fg)}
button.p{background:var(--acc);color:#fff}

</style></head><body>
<button id="gear" title="Settings" aria-label="Settings">⚙</button>

<div id="m"><div id="card">
<h2>SETTINGS</h2>
<h3>LLM · OPENAI-COMPATIBLE</h3>
<label>Endpoint</label><input id="endpoint" placeholder="https://api.openai.com/v1">
<label>API key</label><input id="key" type="password" placeholder="sk-...">
<label>Model</label><input id="model" placeholder="gpt-4o-mini">
<label>System prompt</label><textarea id="sys" rows="2"></textarea>
<h3>VOICE · LOCAL</h3>
<label>TTS model (phonon-tts)</label><input id="tts">
<label for="voice">TTS voice</label><select id="voice"><option value="">Model default</option></select>
<div class="r"><button class="b" id="voicesLoad" type="button">LOAD VOICES</button></div>
<label for="voiceDemo">Demo text</label><input id="voiceDemo" value="Hello. I am Luma, ready when you are.">
<div class="r"><button class="b" id="voiceTest" type="button">TEST VOICE</button><button class="b" id="voiceStop" type="button" disabled>STOP</button></div>
<p id="voiceStatus" role="status" style="font-size:11px;line-height:1.5">Models and the Phonon voice catalog load from local project files. No Hugging Face download is needed for the bundled model.</p>
<label>STT engine</label><select id="sttMode"><option value="whistle">Whistle WebGPU (local)</option><option value="browser">Browser (Web Speech API)</option></select>
<label>STT model (whistle-webgpu)</label><input id="stt">
<label>Device</label><select id="dev"><option>webgpu</option><option>wasm</option></select>
<div class="r"><button class="b" id="x">CLOSE</button><button class="b p" id="sv">SAVE</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
<script>
// ---------- config ----------
const DEF={endpoint:'https://api.openai.com/v1',key:'',model:'gpt-4o-mini',sys:'You are LUMA, a concise, witty AI assistant.',tts:'phonon-tts',voice:'',stt:'whistle-webgpu',sttMode:'browser',dev:'webgpu'};
let cfg={...DEF};try{cfg={...DEF,...JSON.parse(localStorage.getItem('luma-cfg')||'{}')}}catch(e){}
const $=id=>document.getElementById(id),F=['endpoint','key','model','sys','tts','voice','stt','sttMode','dev'];
const openM=()=>{F.forEach(k=>{if(k==='voice')setVoiceOptions(cfg.voice);else $(k).value=cfg[k]});$('m').classList.add('on');refreshVoices()};
$('gear').onclick=openM;$('x').onclick=()=>{stopVoiceDemo();$('m').classList.remove('on')};
$('m').onclick=e=>{if(e.target.id==='m'){stopVoiceDemo();$('m').classList.remove('on')}};
$('sv').onclick=()=>{stopVoiceDemo();F.forEach(k=>cfg[k]=$(k).value);try{localStorage.setItem('luma-cfg',JSON.stringify(cfg))}catch(e){}$('m').classList.remove('on')};

// ---------- palettes (hue-shifted: shadows violet, lights warm yellow) ----------
const hx=h=>{const n=parseInt(h.slice(1),16);return 0xff000000|((n&255)<<16)|(n&0xff00)|((n>>16)&255)};
const P=['#140e30','#241e5c','#4a5a9e','#d8b86a', '#5a1f8a','#e8541c','#ffb400','#fff1a0', '#1a3d9a','#1fa3d6','#44e0d8','#e4fff4'].map(hx),BG=hx('#0a0720'),HZ=['#1a0e3c','#3a1450','#6a2a50'].map(hx);
const Bay=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);

// ---------- hologram geometry ----------
const NR=64,NP=44,rA=[];
for(let i=0;i<NR;i++){const a=[Math.random()-.5,Math.random()-.5,Math.random()-.5],l=Math.hypot(...a);a.forEach((_,k)=>a[k]/=l);
 let u=[-a[1],a[0],0];const ul=Math.hypot(...u)||1;u=u.map(x=>x/ul);const v=[a[1]*u[2]-a[2]*u[1],a[2]*u[0]-a[0]*u[2],a[0]*u[1]-a[1]*u[0]];
 rA.push({u,v,R:2.1+Math.random()*.7,sp:(Math.random()-.5)*1.2,ph:Math.random()*6.28,span:1.4+Math.random()*4.8,mat:i%9==0?2:1})}
const NT=NR*NP+160,pos=new Float32Array(NT*3),pm=new Uint8Array(NT);
const HY=3.7,SR=6.4,sp_=Math.sin(Math.PI/6),cp_=Math.cos(Math.PI/6);

// ---------- state ----------
let W,H,S,C=document.createElement('canvas'),g2=C.getContext('2d'),img,u32,px,dep,sh,tex,spr;
const cam={yaw:.6,zoom:1,px:0,py:0};let mode='idle',E=0,tE=0,micE=0,tm=0,spkT=0,bars=new Float32Array(96),pulses=[];
let actx,an,fd,stream;
const app=new PIXI.Application({background:0x0a0720,antialias:false,resolution:1,autoDensity:false});
app.view.id='v';document.body.prepend(app.view);const hc={width:0,height:0};
const lab=new PIXI.Text('TAP THE CORE TO SPEAK',{fontFamily:'ui-monospace,Menlo,Consolas,monospace',fontSize:15,fill:0xffffff,letterSpacing:4,fontWeight:'bold'});lab.anchor.set(.5);
const ring=new PIXI.Graphics();app.stage.addChild(ring,lab);
function resize(){const d=devicePixelRatio||1,DW=Math.round(innerWidth*d),DH=Math.round(innerHeight*d);
 S=Math.max(2,Math.round(DW/(+new URLSearchParams(location.search).get('px')||600)));W=Math.floor(DW/S);H=Math.floor(DH/S);app.renderer.resize(DW,DH);hc.width=DW>>1;hc.height=DH>>1;
 C.width=W;C.height=H;img=g2.createImageData(W,H);u32=new Uint32Array(img.data.buffer);px=new Uint8Array(W*H);dep=new Float32Array(W*H);sh=new Uint8Array(W*H);
 if(spr){spr.destroy();tex.destroy(true)}
 tex=new PIXI.Texture(new PIXI.BaseTexture(C,{scaleMode:PIXI.SCALE_MODES.NEAREST}));spr=new PIXI.Sprite(tex);spr.scale.set(S);app.stage.addChildAt(spr,0);
 lab.style.fontSize=Math.max(12,Math.round(13*d));lab.x=DW/2;lab.y=DH-40*d}
addEventListener('resize',resize);resize();

// ---------- audio ----------
async function mic(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});actx=actx||new AudioContext({sampleRate:16000});
 an=actx.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.7;const src=actx.createMediaStreamSource(stream);src.connect(an);startVAD(src);fd=new Uint8Array(an.frequencyBinCount);return true}catch(e){lab.text='MIC UNAVAILABLE';return false}}
function stopMic(){proc&&proc.disconnect();stream&&stream.getTracks().forEach(t=>t.stop());stream=an=null}
async function tap(){
 if(mode==='idle'){if(await mic()){mode='listening';vadOn=true;lab.text='LISTENING...';loadW().then(()=>{if(mode==='listening')lab.text='LISTENING...'}).catch(e=>{console.error(e);lab.text='STT FAILED: '+String(e.message).slice(0,40)})}}
 else{vadOn=false;aborted=true;stopSpeech();stopMic();mode='idle';lab.text='TAP THE CORE TO SPEAK'}}

// ---------- input ----------
const ptr=new Map();let moved=0,pd=0;
const V=app.view;V.addEventListener('contextmenu',e=>e.preventDefault());
V.addEventListener('pointerdown',e=>{V.setPointerCapture(e.pointerId);ptr.set(e.pointerId,e);moved=0;V.style.cursor='grabbing';if(ptr.size==2){const[a,b]=[...ptr.values()];pd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}});
V.addEventListener('pointermove',e=>{const o=ptr.get(e.pointerId);if(!o)return;
 if(ptr.size==2){ptr.set(e.pointerId,e);const[a,b]=[...ptr.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);cam.zoom=Math.min(3,Math.max(.4,cam.zoom*d/pd));pd=d;return}
 const dx=e.clientX-o.clientX,dy=e.clientY-o.clientY;moved+=Math.abs(dx)+Math.abs(dy);ptr.set(e.pointerId,e);
 if(e.buttons&2||e.shiftKey){cam.px+=dx;cam.py+=dy}else cam.yaw-=dx*.008});
const up=e=>{if(ptr.has(e.pointerId)&&ptr.size==1&&moved<6){const r=V.getBoundingClientRect(),k=V.width/r.width,mx=(e.clientX-r.left)*k/S,my=(e.clientY-r.top)*k/S;
  const c=proj(0,HY,0);{const px_=(e.clientX-r.left)*k,py_=(e.clientY-r.top)*k,b=btns.find(b=>px_>=b.x0&&px_<=b.x1&&py_>=b.y0&&py_<=b.y1);if(b)b.fn();else if(Math.hypot(mx-c[0],my-c[1])<scl()*1.6)tap()}
 }
 ptr.delete(e.pointerId);V.style.cursor='grab'};
V.addEventListener('pointerup',up);V.addEventListener('pointercancel',up);
V.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=Math.min(3,Math.max(.4,cam.zoom*Math.exp(-e.deltaY*.0012)))},{passive:false});
V.addEventListener('dblclick',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());

// ---------- projection ----------
const scl=()=>cam.zoom*H/15,CX=()=>W/2+cam.px/S,CY=()=>H*.6+cam.py/S;
function proj(x,y,z){const cY=Math.cos(cam.yaw),sY=Math.sin(cam.yaw),x1=x*cY+z*sY,z1=-x*sY+z*cY,s=scl();
 return[CX()+s*x1,CY()-s*(y*cp_-z1*sp_),y*sp_+z1*cp_]}
function plot(x,y,z,s,m,l){const p=proj(x,y,z),X=p[0]|0,Y=p[1]|0;
 for(let j=0;j<s;j++){const yy=Y+j;if(yy<0||yy>=H)continue;for(let i=0;i<s;i++){const xx=X+i;if(xx<0||xx>=W)continue;const k=yy*W+xx;if(p[2]>dep[k]){dep[k]=p[2];px[k]=m*4+l}}}}
const lv=(n,b)=>Math.max(0,Math.min(3,((n*.6+2.2)+b-.5)|0));

// ---------- full-res hologram: flowing streaks, gradients, glow ----------
const COL=['rgba(232,84,28,.45)','rgba(255,120,20,.72)','rgba(255,184,0,.92)','rgba(255,244,170,1)'];
function drawHolo(){const d=hg;d.clearRect(0,0,hc.width,hc.height);d.lineCap='round';
 const s=scl(),cen=proj(0,HY,0),cx=cen[0]*S,cy=cen[1]*S,u=s*S,cd=cen[2],w=Math.max(1,S*.8);
 let g=d.createRadialGradient(cx,cy,u*1.1,cx,cy,u*3.2);g.addColorStop(0,'rgba(255,170,40,0)');g.addColorStop(.72,'rgba(255,150,30,'+(.15+E*.12)+')');g.addColorStop(1,'rgba(255,120,20,0)');
 d.fillStyle=g;d.beginPath();d.arc(cx,cy,u*3.2,0,6.283);d.fill();
 const M=()=>new Path2D(),under=M(),glow=M(),Bk=[[M(),M()],[M(),M()],[M(),M()],[M(),M()]],dots=M();
 for(let i=0;i<NR;i++){const dir=rA[i].sp<0?-1:1;let px0=0,py0=0;
  for(let j=0;j<NP;j++){const k=i*NP+j,p=proj(pos[k*3],pos[k*3+1],pos[k*3+2]),X=p[0]*S,Y=p[1]*S;
   if(j){const f=.5+.5*Math.sin(j*.45-tm*3.2*dir+i*1.7),b=Math.min(3,(f*f*3.99)|0),fr=p[2]>cd?1:0;
    under.moveTo(px0,py0);under.lineTo(X,Y);glow.moveTo(px0,py0);glow.lineTo(X,Y);Bk[b][fr].moveTo(px0,py0);Bk[b][fr].lineTo(X,Y);
    if(b===3&&fr){dots.moveTo(X+u*.035,Y);dots.arc(X,Y,u*.035*(1+E),0,6.283)}}
   px0=X;py0=Y}}
 for(let k=0;k<28;k++){const a=k*2.4+tm*.25,bb=Math.acos(1-2*(k+.5)/28),t=(tm*.45+k*.37)%1,r0=.5+t*2.4,r1=r0+.4,dx=Math.sin(bb)*Math.cos(a),dy=Math.cos(bb),dz=Math.sin(bb)*Math.sin(a),p0=proj(dx*r0,HY+dy*r0,dz*r0),p1=proj(dx*r1,HY+dy*r1,dz*r1),q=Bk[2+(t>.5?1:0)][p0[2]>cd?1:0];q.moveTo(p0[0]*S,p0[1]*S);q.lineTo(p1[0]*S,p1[1]*S)}
 d.strokeStyle='rgba(70,20,120,.15)';d.lineWidth=w*3.2;d.stroke(under);
 d.strokeStyle='rgba(255,130,20,.10)';d.lineWidth=w*7;d.stroke(glow);
 const pass=fr=>{for(let b=0;b<4;b++){d.strokeStyle=COL[b];d.lineWidth=w*(1+b*.45);d.stroke(Bk[b][fr])}};
 d.globalAlpha=.45;pass(0);d.globalAlpha=1;
 const cr=u*(.95+E*.8);g=d.createRadialGradient(cx,cy,0,cx,cy,cr);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,244,170,.95)');g.addColorStop(.55,'rgba(255,170,20,.6)');g.addColorStop(1,'rgba(255,100,20,0)');
 d.fillStyle=g;d.beginPath();d.arc(cx,cy,cr,0,6.283);d.fill();
 pass(1);d.fillStyle='#ffb400';d.fill(dots);
 d.strokeStyle='rgba(255,160,30,.55)';d.lineWidth=w*1.5;d.beginPath();d.ellipse(cx,cy,u*2.85,u*2.85,0,0,6.283);d.stroke()}

// ---------- raster hologram: ragged dashes, circuits, flows, crescent ----------
let gl,gb;const ND=520,dpp=new Float32Array(ND*3),dtn=new Float32Array(ND*3),dbr=new Float32Array(ND),dgr=new Uint8Array(ND);
for(let i=0;i<ND;i++){const a=Math.random()*6.283,c=2*Math.random()-1,s=Math.sqrt(1-c*c),r=Math.random()<.7?2.2+Math.random()*.9:Math.random()*2.2,nx=s*Math.cos(a),ny=c,nz=s*Math.sin(a);
 let tx=Math.random()-.5,ty=Math.random()-.5,tz=Math.random()-.5;const d=tx*nx+ty*ny+tz*nz;tx-=d*nx;ty-=d*ny;tz-=d*nz;const l=Math.hypot(tx,ty,tz)||1,len=Math.min(1,.2-Math.log(Math.random()+.01)*.2);
 dpp.set([nx*r,ny*r,nz*r],i*3);dtn.set([tx/l*len,ty/l*len,tz/l*len],i*3);dbr[i]=1.3+Math.random()*2.6;dgr[i]=i%3}
const NC=36,cp0=new Float32Array(NC*3),cd0=new Float32Array(NC*3);
for(let i=0;i<NC;i++){const a=Math.random()*6.283,c=2*Math.random()-1,s=Math.sqrt(1-c*c),r=1+Math.random()*1.8;cp0.set([s*Math.cos(a)*r,c*r,s*Math.sin(a)*r],i*3);cd0[i*3+i%3]=(.2+Math.random()*.7)*(Math.random()<.5?-1:1)}
const SG=[.09,-.13,.18],TG=[0,.5,-.7];
function rot(g,x,y,z,o){const an=tm*SG[g],c=Math.cos(an),s=Math.sin(an),ct=Math.cos(TG[g]),st=Math.sin(TG[g]),a=x*c+z*s,b=-x*s+z*c;o[0]=a*ct-y*st;o[1]=a*st+y*ct;o[2]=b}
function seg(ax,ay,az,bx,by,bz,m,br){const a=proj(ax,ay,az),b=proj(bx,by,bz);let x0=a[0]|0,y0=a[1]|0;const x1=b[0]|0,y1=b[1]|0,dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,n=Math.max(dx,-dy)||1;let e=dx+dy,i=0;
 for(;;){const t=i/n;if(x0>=0&&x0<W&&y0>=0&&y0<H){const k=y0*W+x0,nn=a[2]+(b[2]-a[2])*t;if(nn>dep[k]){dep[k]=nn;px[k]=m*4+Math.max(0,Math.min(3,((br-(1-t)*1.5)+Bay[(y0&3)*4+(x0&3)]-.5)|0))}}
  if(x0===x1&&y0===y1||++i>300)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function holoRaster(){const o=[0,0,0],o2=[0,0,0],fl=(tm*5)|0;
 for(let i=0;i<ND;i++){const k=i*3,g=dgr[i],h=((i*2654435761+fl*40503)>>>0)%100;if(h<3)continue;const st=1+E*.9;
  rot(g,dpp[k],dpp[k+1],dpp[k+2],o);rot(g,dpp[k]+dtn[k]*st,dpp[k+1]+dtn[k+1]*st,dpp[k+2]+dtn[k+2]*st,o2);seg(o[0],o[1]+HY,o[2],o2[0],o2[1]+HY,o2[2],1,dbr[i]*(h>85?1.3:1))}
 for(let i=0;i<NC;i++){const k=i*3;rot(1,cp0[k],cp0[k+1],cp0[k+2],o);rot(1,cp0[k]+cd0[k],cp0[k+1]+cd0[k+1],cp0[k+2]+cd0[k+2],o2);seg(o[0],o[1]+HY,o[2],o2[0],o2[1]+HY,o2[2],1,1.6+(i%3)*.5)}
 for(let i=0;i<NR;i+=3){const dir=rA[i].sp<0?-1:1;for(let j=1;j<NP;j++){const k=(i*NP+j)*3,q=k-3,f=.5+.5*Math.sin(j*.28-tm*2*dir+i),br=1.3+f*f*2.6;for(let w=0;w<2;w++)seg(pos[q],pos[q+1]+w*.08,pos[q+2],pos[k],pos[k+1]+w*.08,pos[k+2],1,br)}}
 for(const R of[1.45,1.62]){let pv=null;for(let t=0;t<64;t++){const th=.5+t*.065+tm*.15;rot(1,R*Math.cos(th),R*Math.sin(th)*.6,R*Math.sin(th)*.5,o);if(pv)seg(pv[0],pv[1]+HY,pv[2],o[0],o[1]+HY,o[2],1,3.7-Math.abs(t-32)*.03);pv=[o[0],o[1],o[2]]}}
 for(let n=NR*NP;n<NT;n++)plot(pos[n*3],pos[n*3+1],pos[n*3+2],2,1,3)}

// ---------- additive hologram: dense gradient streaks, flowing rings, crescent, glow (half-res, nearest upscaled) ----------
function drawHolo2(){const d=hg,k=S/2,u=scl()*k,cen=proj(0,HY,0),cx=cen[0]*k,cy=cen[1]*k,cd=cen[2],w=Math.max(1,k*.9);
 d.globalCompositeOperation='source-over';d.globalAlpha=1;d.clearRect(0,0,hc.width,hc.height);d.globalCompositeOperation='lighter';d.lineCap='round';
 const M=()=>new Path2D(),T=[M(),M()],Hd=[M(),M()],Ho=[M(),M()],Rg=[[M(),M()],[M(),M()],[M(),M()]],Gl=M(),Sp=M(),Cr=M(),Cc=M(),o=[0,0,0],o2=[0,0,0],st=1+E*.9,fl=(tm*5)|0;
 for(let i=0;i<ND;i++){const j=i*3,g=dgr[i],h=((i*2654435761+fl*40503)>>>0)%100;if(h<6)continue;

    if(((x-shc[0])/srx)**2+((y-shc[1])/sry)**2>1)continue;
    const i=y*W+x;if(px[i]>0&&px[i]<4)px[i]--;
   }

   const r=mrA[i],dir=r.sp<0?-1:1;let pv=null;

// ================= Sub-Agents & Orchestrator System =================
const AG_SYS=`You are a sub-agent of LUMA building in a holographic 3D stage in front of the user. Work in small steps. Reply with ONE JSON object only, no markdown: {"say":"short status","actions":[...],"done":false}. Set done:true when finished.
Stage coordinates: x -6..6 (left to right), y 0..3.4 (height), z -2..2 (toward the user is +). Keep things within x -5..5 and y 0.6..2.8.

{"op":"add","kind":"cube|pyramid|poly|sphere|text","id":"short_id","text":"label","x":0,"y":1.2,"z":0,"size":1.5,"color":"#fff1a0","border":"#ffb400","fill":"#e8541c","fillA":0.85,"bw":2,"fs":14,"n":6}
{"op":"add","kind":"arrow","x":-2,"y":1,"z":0,"x2":2,"y2":2,"z2":0,"border":"#ffb400"}
{"op":"link","from":"id1","to":"id2","text":"label","border":"#ffb400"}  (connects two objects and follows them)
{"op":"update","id":"..", any property}  {"op":"delete","id":".."}  {"op":"clear"} (removes only your own work)
{"op":"panel","id":"..","title":"..","text":"..","side":"left|right"}  {"op":"panel_update","id":"..","text":".."}  {"op":"panel_delete","id":".."}
{"op":"tell_peer","to":"AgentName","text":"message"}  (ONLY available if PEER AGENTS are listed in your context!)
Style: pixel art with palette: orange #e8541c, amber #ffb400, warm yellow #fff1a0, cyan #44e0e8, blue #1fa3d6, violet #5a1f8a, emerald #2fe38a, magenta #ff3ea5.
Rules: Leave ~2.2 units between objects. Give every object a unique short id. A MESSAGE from the user, Luma, or an authorized peer takes priority; if told to stop, finish with done:true.`;

function logA(a,t,isErr=false){a.log.push({t:Date.now(),text:t,err:isErr});if(a.log.length>80)a.log.shift();rq()}
const wds=t=>new Set(String(t).toLowerCase().match(/[a-z0-9]{4,}/g)||[]);
function related(name,task,force){const nm=String(name||'').toLowerCase();let best=null,sc=0;const tw=wds(name+' '+task);
 for(const a of AG.values()){if(nm&&a.name.toLowerCase()===nm)return a;if(force)continue;const aw=wds(a.name+' '+a.task+' '+a.tasks.map(t=>t.text).join(' '));let n=0;for(const w of tw)if(aw.has(w))n++;if(n>sc){sc=n;best=a}}
 if(force)return null;if(sc>=2)return best;if(AG.size>=6)return[...AG.values()].find(a=>a.status!=='running')||best||[...AG.values()][0];return null}

function pickSlot(){const usedSlots=new Set([...AG.values()].map(a=>a.slot));for(let i=0;i<SLOTS.length;i++)if(!usedSlots.has(i))return i;return AG.size%SLOTS.length}
function pickPal(){const usedPals=new Set([...AG.values()].map(a=>a.pal?.name));const avail=PALS.filter(p=>!usedPals.has(p.name));const pool=avail.length?avail:PALS;return pool[Math.floor(Math.random()*pool.length)]}

function peerContext(a){
 if(!a.peers||!a.peers.size)return'';
 const list=[...AG.values()].filter(x=>x.id!==a.id&&(a.peers.has('*')||a.peers.has(x.name.toLowerCase())||a.peers.has(x.id)));
 if(!list.length)return'';
 return'\nAUTHORIZED PEER AGENTS (you may coordinate or message them via {"op":"tell_peer","to":"Name","text":"..."}):\n'+
  list.map(x=>'- '+x.name+' ('+x.status+', task: '+x.task.slice(0,60)+', last: '+(x.log.length?x.log[x.log.length-1].text.slice(0,70):'none')+')').join('\n');
}

// Notifies main Luma when a sub-agent finishes or fails
const notifyQ=[];let notifyT=null;
function notifyLuma(a,ev,detail){
 if(!ext.notify)return;
 notifyQ.push({name:a.name,id:a.id,ev,task:a.task,detail});
 clearTimeout(notifyT);
 notifyT=setTimeout(flushNotify,900);
}
async function flushNotify(){
 if(!notifyQ.length)return;
 if(busy||mode==='thinking'||mode==='speaking'){notifyT=setTimeout(flushNotify,1200);return}
 const anyRun=[...AG.values()].some(a=>a.status==='running');
 const hasErr=notifyQ.some(n=>n.ev==='FAILED');
 if(anyRun&&!hasErr){notifyT=setTimeout(flushNotify,1200);return}
 const batch=notifyQ.splice(0);
 const msg='[SUB-AGENT EVENT REPORT]\n'+batch.map(b=>`• Agent "${b.name}" (${b.id}) ${b.ev}: ${b.detail} (Task: ${b.task.slice(0,70)})`).join('\n')+
  '\n Briefly inform the user of the outcome or error, and issue any follow-up [[...]] directives if needed.';
 try{await userText(msg)}catch(e){console.error(e)}
}

function spawn(name,task,model,force,peersStr){
 task=String(task||'');const ex=related(name,task,force);
 if(ex){if(peersStr)grantPeers(ex,peersStr);tell(ex,'NEW TASK: '+task.slice(0,300));logA(ex,'(reused existing agent)');return ex}
 const id='a'+(++aid),slot=pickSlot(),pal=pickPal();
 const a={id,name:(name||'agent'+aid).slice(0,20),task:task.slice(0,300),tasks:[{text:task.slice(0,120),st:'run'}],model:model||ext.am||cfg.model,
  status:'running',lastErr:'',log:[],msgs:[{role:'user',content:'TASK: '+task}],inbox:[],peers:new Set(),
  slot,pos:{...SLOTS[slot]},pal,spawnA:0,tm:Math.random()*10,E:0,step:0,bad:0,ctl:null,open:true,think:false,running:false};
 if(peersStr)grantPeers(a,peersStr);
 AG.set(id,a);logA(a,'spawned ('+pal.name+' holo): '+a.task);run(a);return a;
}

function grantPeers(a,peersStr){
 if(!peersStr)return;
 const parts=String(peersStr).split(/[,\s]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);
 for(const p of parts){
  if(p==='all'||p==='*'){a.peers.add('*');for(const x of AG.values())if(x.id!==a.id)x.peers.add(a.name.toLowerCase())}
  else{a.peers.add(p);const t=findA(p);if(t)t.peers.add(a.name.toLowerCase())}
 }
 logA(a,'peer access granted: '+([...a.peers].join(', ')||'none'));
}

function parseJ(t){t=String(t).replace(/```json|```/g,'');const i=t.indexOf('{'),j=t.lastIndexOf('}');if(i<0||j<i)return null;try{return JSON.parse(t.slice(i,j+1))}catch(e){return null}}

async function llm(a){
 const url=(ext.ae||cfg.endpoint).replace(/\/$/,'')+'/chat/completions';
 let r;
 try{
  r=await fetch(url,{signal:a.ctl.signal,method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(ext.ak||cfg.key)},
   body:JSON.stringify({model:a.model,stream:false,messages:[{role:'system',content:AG_SYS+peerContext(a)},...a.msgs]})});
 }catch(netErr){
  throw new Error(`Network/Fetch error (${url}): ${netErr.message||netErr}`);
 }
 if(!r.ok){
  let bodyTxt='';try{bodyTxt=await r.text()}catch(e){}
  let errMsg=`HTTP ${r.status} (${r.statusText||'Error'}) on model "${a.model}"`;
  try{const ej=JSON.parse(bodyTxt);if(ej.error?.message)errMsg+=`: ${ej.error.message}`}catch(e){if(bodyTxt)errMsg+=`: ${bodyTxt.slice(0,120)}`}
  throw new Error(errMsg);
 }
 const data=await r.json();
 if(!data?.choices?.[0]?.message)throw new Error(`Empty/Malformed LLM response from "${a.model}"`);
 return data.choices[0].message.content||'';
}

async function run(a){if(a.running)return;a.running=true;a.open=true;a.lastErr='';
 try{while(a.status==='running'){
  if(a.step>=ext.max){a.status='done';logA(a,'step limit reached ('+ext.max+')');notifyLuma(a,'COMPLETED','Reached max steps ('+ext.max+'). Last status: '+(a.log[a.log.length-1]?.text||'done'));break}
  if(a.inbox.length)a.msgs.push({role:'user',content:'MESSAGE: '+a.inbox.splice(0).join(' | ')});
  a.ctl=new AbortController();a.think=true;rq();const txt=await llm(a);a.think=false;if(a.status!=='running')break;a.step++;const j=parseJ(txt);
  if(!j){
   a.msgs.push({role:'assistant',content:String(txt).slice(0,500)},{role:'user',content:'Invalid JSON. Reply with ONE valid JSON object only.'});
   logA(a,'Malformed JSON reply (retry '+a.bad+'/3): '+String(txt).slice(0,80),true);
   if(++a.bad>3){throw new Error('Aborted after 3 consecutive malformed JSON replies from model "'+a.model+'"')}
   continue;
  }
  a.bad=0;a.msgs.push({role:'assistant',content:JSON.stringify(j)});if(j.say)logA(a,String(j.say));
  const res=(Array.isArray(j.actions)?j.actions:[]).slice(0,12).map(x=>{try{return act(x||{},a.name,a)}catch(e){return'err '+e.message}});
  if(res.length){
   const errs=res.filter(r=>r.startsWith('err '));
   logA(a,'• '+res.join(', '),errs.length>0);
  }
  if(j.done){a.status='done';logA(a,'✓ finished');notifyLuma(a,'COMPLETED',j.say||'Task completed');break}
  a.msgs.push({role:'user',content:'RESULTS: '+(res.join('; ')||'none')+'\nSCENE: '+scene()+peerContext(a)});
  if(a.msgs.length>18)a.msgs.splice(1,a.msgs.length-15);await sl(350);
 }}catch(e){
  if(a.status==='running'){
   a.status='error';a.lastErr=e.message||String(e);
   logA(a,'✖ ERROR: '+a.lastErr,true);
   notifyLuma(a,'FAILED',a.lastErr);
  }
 }
 a.running=false;a.think=false;
 if(a.status!=='running'){a.open=a.status==='error';const lt=a.tasks[a.tasks.length-1];if(lt&&lt.st==='run')lt.st=a.status==='done'?'done':a.status}
 rq();
}
const stopA=a=>{if(a.status==='running'){a.status='stopped';a.ctl&&a.ctl.abort();logA(a,'stopped')}};
function tell(a,m){a.inbox.push(m);logA(a,'» '+m);
 if(/^NEW TASK:/.test(m)){const t=m.slice(9).trim();a.task=t.slice(0,300);a.tasks.forEach(x=>{if(x.st==='run')x.st='done'});a.tasks.push({text:t.slice(0,120),st:'run'})}
 if(a.status!=='running'){a.open=true;a.status='running';a.lastErr='';a.step=Math.min(a.step,ext.max-4);run(a)}rq()}
const killA=a=>{stopA(a);killPlaneTxt('ag_'+a.id);AG.delete(a.id);rq()};

// ================= Luma Awareness + Orchestrator Directives =================
const JDOC=`WORKSPACE & SUB-AGENT ORCHESTRATOR:
You control sub-agents that appear as colored mini-holograms beside you and build 3D shapes, arrows, links and panels on the stage.
Put directives inside double square brackets in your reply (never spoken aloud):
- [[agent Name | task text | optional model | optional peers]] spawns an agent (e.g. [[agent Arch | draw 3-tier system | | Net,DB]] or [[agent Builder | build cubes | | all]]).
- [[share Name1 | Name2]] or [[share all]] grants sub-agents permission to see each other's state and message each other directly. Sub-agents are isolated unless you grant peer access!
- [[unshare Name]] revokes peer visibility for an agent.
- [[tell Name | instructions]] sends new instructions or fixes to an existing agent (restarts it if finished or failed).
- [[stop Name]] (or [[stop all]]), [[resume Name]], [[kill Name]] (removes its mini-hologram from the scene).
- [[clear]], [[add cube | label | #hex]] (kinds: cube pyramid poly sphere text arrow), [[del id]].
Never put periods, question marks or brackets inside a directive.
Always check LIVE STATE first: reuse existing agents by topic with [[tell Name | ...]] instead of spawning duplicates. If an agent has status=error, read its exact LAST_ERROR in LIVE STATE, explain why it failed to the user, and either retry/fix it with [[tell Name | ...]] or kill/respawn it.`;

const strip=t=>String(t).replace(/\[\[[^\]]*\]\]/g,'').replace(/\[\[[^\]]*$/,'').replace(/ {2,}/g,' ');
const findA=n=>{n=String(n||'').trim().toLowerCase();return[...AG.values()].find(x=>x.id===n||x.name.toLowerCase()===n)};
function directives(t){for(const m of String(t).matchAll(/\[\[\s*(\w+)\s*([^\]]*)\]\]/g)){
 const c=m[1].toLowerCase(),a=m[2].split('|').map(s=>s.trim()),x=findA(a[0]);
 if(c==='agent')spawn(a[1]?a[0]:'',a[1]||a[0],a[2],false,a[3]);
 else if(c==='share'){if(a[0]?.toLowerCase()==='all')for(const ag of AG.values())grantPeers(ag,'all');else if(x)grantPeers(x,a.slice(1).join(',')||'all')}
 else if(c==='unshare'&&x){x.peers.clear();logA(x,'peer access revoked')}
 else if(c==='tell'&&x)tell(x,a[1]||'');
 else if(c==='stop'){a[0]==='all'?AG.forEach(stopA):x&&stopA(x)}
 else if(c==='resume'&&x)tell(x,'resume');
 else if(c==='kill'){a[0]==='all'?[...AG.values()].forEach(killA):x&&killA(x)}
 else if(c==='clear')delAll();else if(c==='del')delObj(a[0]);
 else if(c==='add')addObj({kind:a[0],text:a[1],border:a[2],fill:a[2]},'luma');
}}

 `${a.name}(id:${a.id}, color:${a.pal.name}, status:${a.status}, steps:${a.step}/${ext.max}, model:${a.model}, peers:[${[...a.peers].join(',')}], task:"${a.task.slice(0,60)}"`+
 (a.lastErr?`, LAST_ERROR:"${a.lastErr}"`:'')+
 `, last_log:"${a.log.length?a.log[a.log.length-1].text.slice(0,80):'-'}")`
).join('; ')||'none')+'\nScene: '+scene();

 box.innerHTML='<label>'+o.kind.toUpperCase()+' · '+o.id+' · by '+esc(o.by)+'</label><input data-p="text" value="'+esc(o.text)+'" placeholder="text / label">'
  +'<div class="g3">'+c('color','TEXT')+c('border','BORDER')+c('fill','FILL')+'</div>'
  +n('fillA','FILL DENSITY',o.fillA,0,1,.01,'range')+n('bw','BORDER WIDTH',o.bw,0,10,.5,'range')+(o.kind==='link'?'':n('size','SIZE',t.size,.2,5,.1,'range'))+n('fs','FONT SIZE',o.fs,8,64,1,'range')
  +(o.kind==='poly'?n('n','SIDES',o.n,3,12,1,'range'):'')
  +(o.kind==='link'?'':'<div class="g3">'+n('x','X',t.x,-8,8,.1)+n('y','Y',t.y,0,3.4,.1)+n('z','Z',t.z,-8,8,.1)+'</div>')
  +(o.kind==='arrow'?'<div class="g3">'+n('x2','X2',t.x2,-8,8,.1)+n('y2','Y2',t.y2,0,3.4,.1)+n('z2','Z2',t.z2,-8,8,.1)+'</div>':'')
  +'<div style="margin-top:4px;display:flex;gap:6px"><button id="idup">DUPLICATE</button><button id="idel">DELETE</button></div>';
 $$('#idel').onclick=()=>{delObj(o.id);sel=null;renderInsp()};
 $$('#idup').onclick=()=>{if(o.kind==='link')return;const q=addObj({kind:o.kind,text:o.text,color:o.color,border:o.border,fill:o.fill,fillA:o.fillA,bw:o.bw,fs:o.fs,n:o.n,size:t.size,x:t.x+.8,y:t.y,z:t.z,x2:t.x2+.8,y2:t.y2,z2:t.z2});sel=q.id;renderInsp()}}
$$('#insp').addEventListener('input',e=>{const o=O.get(sel),k=e.target.dataset.p;if(!o||!k)return;const v=e.target.type==='text'?e.target.value:e.target.type==='color'?e.target.value:+e.target.value;setObj(o,{[k]:v})});
function refreshUI(){const s=$$('#osel');if(!s)return;if(document.activeElement===s)return;
 s.innerHTML='<option value="">— objects ('+[...O.values()].filter(o=>!o.dying).length+') —</option>'+[...O.values()].filter(o=>!o.dying).map(o=>'<option value="'+o.id+'"'+(o.id===sel?' selected':'')+'>'+o.id+' · '+o.kind+(o.text?' · '+esc(o.text.slice(0,14)):'')+'</option>').join('');if(!(tlp.contains(document.activeElement)&&document.activeElement.tagName==='INPUT'))renderInsp()}
setInterval(refreshUI,900);

let rqT;function rq(){clearTimeout(rqT);rqT=setTimeout(()=>renderAg(),120)}
function renderAg(){const box=$$('#agl');if(!box)return;if(box.contains(document.activeElement)&&document.activeElement.tagName==='INPUT')return;$$('#agn').textContent=AG.size;
 box.innerHTML=[...AG.values()].map(a=>{const last=a.log.length?a.log[a.log.length-1].text:'';
  const peerBadge=a.peers.size?'<span class="peer-tag" title="Authorized Peers">⇄ '+esc([...a.peers].join(','))+'</span>':'';
  return'<div class="ar'+(a.status==='running'?' run':'')+'" data-id="'+a.id+'"><div class="rh" data-a="tog"><span class="dot '+a.status+'" style="background:'+(a.status==='error'?'#ff2a38':a.pal.hex)+'"></span><b style="color:'+a.pal.hex+'">'+esc(a.name)+'</b>'+peerBadge+'<i>'+esc(a.model)+' · '+a.step+'/'+ext.max+' '+(a.open?'▾':'▸')+'</i></div>'
  +'<div class="sy" data-a="tog">'+(a.think?'<span class="th">thinking…</span> ':'')+esc(last)+'</div>'
  +(a.lastErr?'<div class="err-box"><b>FAILED:</b> '+esc(a.lastErr)+'</div>':'')
  +(a.open?'<div class="tl">'+a.tasks.map(t=>'<div>'+(t.st==='run'?'▶':t.st==='done'?'✓':'■')+' '+esc(t.text)+'</div>').join('')+'</div><pre class="lg">'+esc(a.log.slice(-16).map(l=>l.text).join('\n'))+'</pre><div class="bt">'+(a.status==='running'?'<button data-a="stop">STOP</button>':'<button data-a="run">RETRY / RESUME</button>')+'<button data-a="peer">'+(a.peers.has('*')?'ISOLATE':'SHARE PEERS')+'</button><button data-a="clr">CLEAR WORK</button><button data-a="kill">REMOVE HOLO</button></div><input data-t="'+a.id+'" placeholder="message '+esc(a.name)+' + Enter">':'')+'</div>'}).join('')||'<div class="mut">No agents yet. Ask Luma to build something, or launch one above.</div>'}

$$('#agl').onclick=e=>{const el=e.target.closest('[data-a]'),b=el&&el.dataset.a,a=AG.get(e.target.closest('.ar')?.dataset.id);if(!b||!a)return;
 if(b==='tog')a.open=!a.open;
 else if(b==='stop')stopA(a);
 else if(b==='run')tell(a,'retry and continue task');
 else if(b==='peer'){if(a.peers.has('*')){a.peers.clear();logA(a,'isolated from peers')}else grantPeers(a,'all')}
 else if(b==='clr')delAll(a.name);
 else if(b==='kill')killA(a);
 renderAg()};
$$('#agl').onkeydown=e=>{if(e.key!=='Enter'||!e.target.dataset.t)return;const a=AG.get(e.target.dataset.t),v=e.target.value.trim();if(a&&v){e.target.value='';tell(a,v);e.target.blur();renderAg()}};
$$('#ago').onclick=()=>{const t=$$('#at').value.trim();if(!t)return;spawn($$('#an').value.trim(),t,$$('#am').value.trim(),true,$$('#ap').value.trim());$$('#at').value='';$$('#an').value='';$$('#ap').value='';$$('#agnew').open=false;renderAg()};
renderAg();refreshUI();

// ================= Settings: Sub-Agent Model Override =================
const card=document.getElementById('card'),sx=document.createElement('div');
sx.innerHTML='<h3>SUB-AGENTS</h3><label>Sub-agent model (blank = main model)</label><input id="xm" placeholder="e.g. gpt-4o-mini"><label>Endpoint override (blank = main)</label><input id="xe" placeholder="https://..."><label>API key override (blank = main)</label><input id="xk" type="password"><label>Max steps per agent</label><input id="xs" type="number" min="2" max="40">';
card.insertBefore(sx,card.lastElementChild);
const fill=()=>{xm.value=ext.am;xe.value=ext.ae;xk.value=ext.ak;xs.value=ext.max};fill();
sx.addEventListener('input',()=>{ext.am=xm.value.trim();ext.ae=xe.value.trim();ext.ak=xk.value;ext.max=num(xs.value,2,40,14);saveExt()});
document.getElementById('gear').addEventListener('click',fill);

// ================= Pointer Selection (Objects + Mini-Holos) & Keyboard =================
V.addEventListener('pointerup',e=>{if(moved>=6)return;const r=V.getBoundingClientRect(),k=V.width/r.width,x=(e.clientX-r.left)*k,y=(e.clientY-r.top)*k;
 for(const a of AG.values()){
  if(Math.hypot(x-a.sx,y-a.sy)<a.sr){a.open=true;agp.classList.remove('c');renderAg();msg('Agent '+a.name+' ('+a.status+')');return}
 }
 let best=null,bd=1e9;
 for(const o of O.values()){if(o.dying)continue;const dd=Math.hypot(x-o.sx,y-o.sy);if(dd<o.sr&&dd<bd){best=o;bd=dd}}
 if(best){if(linkFrom&&linkFrom!==best.id){addObj({kind:'link',from:linkFrom,to:best.id},'user');msg('Linked '+linkFrom+' → '+best.id);linkFrom=null}else{sel=best.id;renderInsp();refreshUI()}}
 else if(sel){sel=null;renderInsp();refreshUI()}});
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if((e.key==='Delete'||e.key==='Backspace')&&sel){delObj(sel);sel=null;renderInsp();refreshUI()}});
window.LUMA={act,spawn,O,AG,PN,grantPeers};
})();
</script>
</body></html>
